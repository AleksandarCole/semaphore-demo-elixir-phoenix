version: v1.0
name: "\U0001F525 Phoenix CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'elixir:1.18'
    - name: postgres
      image: 'postgres:17'
      env_vars:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: app_test
    - name: redis
      image: 'redis:7.0'
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - mix local.hex --force
      - mix local.rebar --force
      - cache restore mix-deps-$(checksum mix.lock)
      - cache restore build-$(checksum mix.lock)
      - cache restore npm-modules-$(checksum assets/package-lock.json)
      - cache restore plt-cache
      - mix deps.get
blocks:
  - name: "\U0001F6E0️ Setup and Cache"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F4E6 Install Dependencies"
          commands:
            - mix deps.compile
            - mix compile
            - cd assets && npm ci
            - cache store mix-deps-$(checksum mix.lock) deps
            - cache store build-$(checksum mix.lock) _build
            - cache store npm-modules-$(checksum assets/package-lock.json) assets/node_modules
            - mkdir -p priv/plts
            - cache store plt-cache priv/plts
  - name: "\U0001F3A8 Assets"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: "\U0001F58C️ Compile Assets"
          commands:
            - cd assets && npm run deploy
            - mix phx.digest
  - name: "\U0001F50D Code Quality"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: ✨ Lint and Format
          commands:
            - mix format --check-formatted
            - mix credo --strict
            - cd assets && npm run lint
  - name: "\U0001F510 Security Checks"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: "\U0001F6E1️ Security Scan"
          commands:
            - mix deps.audit
            - mix sobelow --config
            - cd assets && npm audit --production
  - name: "\U0001F4CA Dialyzer"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: "\U0001F50E Type Checking"
          commands:
            - mix dialyzer --plt
  - name: "\U0001F9EA Test Suite"
    dependencies:
      - "\U0001F3A8 Assets"
      - "\U0001F4CA Dialyzer"
      - "\U0001F50D Code Quality"
      - "\U0001F510 Security Checks"
      - "\U0001F6E0️ Setup and Cache"
    task:
      env_vars:
        - name: MIX_ENV
          value: test
        - name: DATABASE_URL
          value: 'postgresql://postgres:postgres@postgres:5432/app_test'
        - name: PGHOST
          value: postgres
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          value: postgres
        - name: REDIS_URL
          value: 'redis://redis:6379'
      jobs:
        - name: "\U0001F7E2 ExUnit Tests"
          parallelism: 4
          commands:
            - mix ecto.create
            - mix ecto.migrate
            - mix test --cover --partitions $SEMAPHORE_JOB_COUNT --partition $SEMAPHORE_JOB_INDEX
      epilogue:
        always:
          commands:
            - mix coveralls.json || true
            - test-results publish coverage.json || true
  - name: "\U0001F310 Browser Tests"
    dependencies:
      - "\U0001F9EA Test Suite"
    task:
      env_vars:
        - name: MIX_ENV
          value: test
        - name: DATABASE_URL
          value: 'postgresql://postgres:postgres@postgres:5432/app_test'
        - name: PGHOST
          value: postgres
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          value: postgres
        - name: REDIS_URL
          value: 'redis://redis:6379'
      jobs:
        - name: "\U0001F3AD Wallaby Tests"
          commands:
            - apt-get update && apt-get install -y wget gnupg ca-certificates
            - 'wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -'
            - 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google.list'
            - apt-get update && apt-get install -y google-chrome-stable
            - 'mix test --only browser:true'
  - name: "\U0001F680 Deploy Checks"
    dependencies:
      - "\U0001F310 Browser Tests"
    task:
      env_vars:
        - name: MIX_ENV
          value: prod
        - name: DATABASE_URL
          value: 'postgresql://postgres:postgres@postgres:5432/app_test'
        - name: PGHOST
          value: postgres
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          value: postgres
      jobs:
        - name: "\U0001F504 Migration Safety"
          commands:
            - mix ecto.migrations
            - mix phx.routes
        - name: "\U0001F4E6 Release Build"
          commands:
            - MIX_ENV=prod mix release --dry-run
  - name: "\U0001F433 Docker"
    dependencies:
      - "\U0001F680 Deploy Checks"
    task:
      env_vars:
        - name: DOCKER_USERNAME
          value: example_only
        - name: DOCKER_PASSWORD
          value: EXAMPLE ONLY - use Semaphore secrets instead for sensitive data
      jobs:
        - name: "\U0001F4E6 Build and Push"
          commands:
            - echo "You should use Semaphore Secret to store credentials and other sensitive data"
            - 'echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin'
            - 'docker build -t "${DOCKER_USERNAME}/phoenix-app:${SEMAPHORE_GIT_SHA:0:7}" .'
            - 'docker tag "${DOCKER_USERNAME}/phoenix-app:${SEMAPHORE_GIT_SHA:0:7}" "${DOCKER_USERNAME}/phoenix-app:latest"'
            - 'docker push "${DOCKER_USERNAME}/phoenix-app:${SEMAPHORE_GIT_SHA:0:7}"'
            - 'docker push "${DOCKER_USERNAME}/phoenix-app:latest"'
