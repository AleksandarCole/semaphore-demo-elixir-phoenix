version: v1.0
name: "\U0001F525 Phoenix CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'registry.semaphoreci.com/elixir:1.15.7'
    - name: postgres
      image: 'registry.semaphoreci.com/postgres:17'
      env_vars:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: app_test
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  env_vars:
    - name: AWS_DEFAULT_REGION
      value: your_aws_region
    - name: DOCKER_REPOSITORY_URI
      value: your_ecr_container
  prologue:
    commands:
      - checkout
      - mix local.rebar --force && mix local.hex --force
      - cache restore
      - mix deps.get
      - cache store
blocks:
  - name: "\U0001F6E0️ Setup"
    task:
      jobs:
        - name: Compile Code
          commands:
            - mix compile
  - name: "\U0001F50D Analyze Code"
    task:
      jobs:
        - name: Run Credo
          commands:
            - mix credo -a
        - name: Check Formatting
          commands:
            - mix format --check-formatted
  - name: "\U0001F9EA Run Tests"
    task:
      jobs:
        - name: Run Tests and Generate Coverage
          env_vars:
            - name: DATABASE_URL
              value: 'ecto://postgres:@postgres:5432/app_test'
            - name: MIX_ENV
              value: test
          commands:
            - mix coveralls.lcov
            - cache store coverage-$SEMAPHORE_WORKFLOW_ID cover
  - name: "\U0001F4E6 Build Docker Image"
    task:
      prologue:
        commands:
          - 'echo ''For this job to work, you would need to create and attach Semaphore secret containing AWS credentials'''
          - echo 'eval $(aws ecr get-login --no-include-email)'
      jobs:
        - name: Build and Push Docker Image
          commands:
            - 'docker build -t ${DOCKER_REPOSITORY_URI}:${SEMAPHORE_GIT_SHA} .'
            - 'docker push ${DOCKER_REPOSITORY_URI}:${SEMAPHORE_GIT_SHA}'
after_pipeline:
  task:
    jobs:
      - name: Generate Test Reports
        commands:
          - test-results gen-pipeline-report
      - name: Test Coverage Summary
        commands:
          - sudo apt-get install -y lcov
          - cache restore coverage-$SEMAPHORE_WORKFLOW_ID
          - lcov -l cover/lcov.info
