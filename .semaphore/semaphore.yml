version: v1.0
name: "\U0001F4AB Elixir CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'elixir:1.15.7'
    - name: postgres
      image: 'postgres:17'
      env_vars:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: myapp_test
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - cache restore mix-deps-$(checksum mix.lock)
      - cache restore build-$(checksum mix.lock)
      - mix local.hex --force
      - mix local.rebar --force
      - mix deps.get
blocks:
  - name: "\U0001F6E0️ Setup and Cache"
    dependencies: []
    task:
      jobs:
        - name: Install Dependencies
          commands:
            - mix deps.compile
            - mix compile
            - cache store mix-deps-$(checksum mix.lock) deps
            - cache store build-$(checksum mix.lock) _build
  - name: "\U0001F50D Code Quality"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: Run Formatter and Credo
          commands:
            - mix format --check-formatted
            - mix deps.get && mix credo --strict
  - name: "\U0001F510 Security Checks"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: Run Security Scans
          commands:
            - mix deps.get && mix deps.audit
            - mix deps.get && mix sobelow --config
  - name: "\U0001F4CA Dialyzer"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: Type Checking
          commands:
            - cache restore plt-cache
            - mix dialyzer --format short
            - cache store plt-cache priv/plts
  - name: "\U0001F9EA Test Suite"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      env_vars:
        - name: MIX_ENV
          value: test
        - name: DATABASE_URL
          value: 'postgres://postgres:postgres@localhost/myapp_test'
        - name: PGHOST
          value: localhost
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          value: postgres
      jobs:
        - name: "\U0001F7E2 Run Tests with Coverage"
          parallelism: 4
          commands:
            - mix ecto.create
            - mix ecto.migrate
            - mix test --partitions $SEMAPHORE_JOB_COUNT --partition $SEMAPHORE_JOB_INDEX --cover
      epilogue:
        always:
          commands:
            - mix coveralls.json
            - test-results publish coverage.json
